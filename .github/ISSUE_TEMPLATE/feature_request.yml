name: Feature Request
description: Suggest an Idea, Improvement, or New Capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Take a look at `docs/roadmap.md` first — it might already be planned, or blocked on
        something specific. `docs/data-policy.md` is worth a skim too: some things are deliberately absent rather than
        missing, and it says which and why.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing, confusing, or frustrating today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
    validations:
      required: false
