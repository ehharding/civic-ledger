version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The same one-day distance `minimumReleaseAge` in pnpm-workspace.yaml enforces for `pnpm add`.
    cooldown:
      default-days: 1
    groups:
      development-dependencies:
        dependency-type: development
    ignore:
      # `@types/node`'s major is the Node major it describes, so it moves with `.nvmrc` and `engines`, not on its own.
      # See CONTRIBUTING.md.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    # `/` scans `.github/workflows` only; the composite actions reference `pnpm/action-setup` and `actions/setup-node`.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    # One pull request per week for the whole set: they often move together, and each is a one-line change.
    groups:
      github-actions:
        patterns: ["*"]
