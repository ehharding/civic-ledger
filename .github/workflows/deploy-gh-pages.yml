name: Deploy (GitHub Pages Demo)

# This publishes a STATIC DEMO ONLY. GitHub Pages cannot hold the server-only CONGRESS_API_KEY and cannot run Next.js
# route handlers or a database, so this build always renders the clearly labeled preview fixtures — never live
# congressional data. For the real, live-data app, use the Vercel workflow (deploy-vercel.yml) instead. See the "GitHub
# Pages" section of the README before enabling this workflow.
#
# The build itself lives in .github/actions/build-static-demo, shared with the `static-export` job in ci.yml so a pull
# request finds out it broke the demo before the change lands rather than after.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build-static-demo
        with:
          base-path: /${{ github.event.repository.name }}
          site-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
