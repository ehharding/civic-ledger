name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One in-flight run per branch or pull request. Pushing a fixup while CI is still chewing on the previous commit should
# replace that run, not queue behind it — the older commit's result is about to be irrelevant either way. `main` is
# excluded from cancellation so every commit that lands keeps a result of its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm build

      # Dependabot opens a pull request per outdated package; it does not answer "is anything installed right now
      # known-vulnerable". Those are different questions, and only the second one has an answer that can regress
      # between dependency bumps — a transitive package can have an advisory published against a version this lockfile
      # already pins, with no update to prompt a bot. This asks it on every run.
      #
      # Gated at `high` rather than at everything. The bar is what should *stop a merge*, and this project's
      # dependencies are almost entirely build and test tooling: a moderate advisory in a dev-only transitive is worth
      # seeing and is not worth blocking a documentation fix over. `pnpm audit` with no threshold reports the full list
      # either way — see the `overrides` block in pnpm-workspace.yaml, which closed the one finding that existed when
      # this step was added. Lower the bar here the moment a runtime dependency makes it the wrong one.
      - name: Audit Dependencies
        run: pnpm audit --audit-level high

  # The static export is the one build a change can break while passing everything above: `pnpm build` is the *server*
  # build, so a new route handler or a fresh `request.url` read compiles, type-checks, and tests clean and then fails
  # only under `output: "export"`. deploy-gh-pages.yml runs on pushes to `main`, which meant that failure used to
  # surface after the change had landed. This job moves it onto the pull request, using the same composite action the
  # deploy workflow builds with so the two cannot diverge.
  #
  # The base path and site URL are the values the real demo is published under, so `basePath`-sensitive output — the
  # header's plain `<form action>`, the sitemap, robots.txt — is exercised the way it actually ships rather than at a
  # bare root that hides prefix bugs.
  static-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build-static-demo
        with:
          base-path: /${{ github.event.repository.name }}
          site-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

  browser:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # `playwright.config.ts` sets `trace: "on-first-retry"` and the HTML reporter, both of which exist to make a
      # failure diagnosable — and both of which were being written into a runner that then evaporated. A red e2e job is
      # exactly when that output is worth having, so it is kept only then: a passing run's report says nothing a green
      # check does not already say, and uploading it every time would be paying storage for that silence.
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
