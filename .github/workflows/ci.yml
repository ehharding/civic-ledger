name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One in-flight run per branch or pull request: a new push replaces the older run. `main` is excluded so every commit
# that lands keeps a result of its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm build

      # A route that stops being static still builds clean; it just renders on every visit, which is metered server
      # work. Fails on any per-request route outside `/api/*` and `/query/*`. See scripts/check-route-rendering.mts.
      - name: Check Route Rendering
        run: pnpm check:routes

      # Dependabot proposes updates; it does not report an advisory published against a version the lockfile already
      # pins. Gated at `high` because the dependencies are almost all build and test tooling — lower it if a runtime
      # dependency makes that the wrong bar. How a finding is closed: `overrides` and `auditConfig` in
      # pnpm-workspace.yaml.
      - name: Audit Dependencies
        run: pnpm audit --audit-level high

  # The one build a change can break while passing everything above, since `pnpm build` is the server build. Uses the
  # deploy workflow's own composite action and the demo's real base path and URL, so the pull request sees the failure
  # (and any prefix bug in the header form, sitemap, or robots.txt) before `main` does.
  static-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build-static-demo
        with:
          base-path: /${{ github.event.repository.name }}
          site-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

  browser:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # The trace and HTML report exist to diagnose a failure, so they are kept only when there is one.
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
