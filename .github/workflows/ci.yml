name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One in-flight run per branch or pull request. Pushing a fixup while CI is still chewing on the previous commit should
# replace that run, not queue behind it — the older commit's result is about to be irrelevant either way. `main` is
# excluded from cancellation so every commit that lands keeps a result of its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Read from .nvmrc rather than pinned here, so the version a contributor's `nvm use` picks and the version CI
          # builds against cannot drift apart. `engines` in package.json states the floor; .nvmrc names the one to use.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  browser:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Read from .nvmrc rather than pinned here, so the version a contributor's `nvm use` picks and the version CI
          # builds against cannot drift apart. `engines` in package.json states the floor; .nvmrc names the one to use.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
