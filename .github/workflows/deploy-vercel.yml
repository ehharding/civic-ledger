name: Deploy (Vercel)

# Vercel is the recommended production target: Civic Ledger's Congress.gov API key must stay server-side, and the app
# relies on dynamic route handlers, ISR (`revalidate`), and a future Postgres-backed auth layer — none of which a static
# host like GitHub Pages can run. See docs/deployment.md for both pipelines and what each one can serve.
#
# Setup (one time):
#   1. `pnpm dlx vercel link` locally to create/link the Vercel project. (Unpinned on purpose: this is a one-time
#      interactive setup run on a person's own machine, not the pinned CLI the jobs below use. @see VERCEL_CLI.)
#   2. Add repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
#   3. Set CONGRESS_API_KEY (and DATABASE_URL, once persistence lands) as encrypted environment variables in the Vercel
#      project settings — not as GitHub secrets — so the key never appears in Action logs.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

# The Vercel CLI, pinned.
#
# Bare `pnpm dlx vercel` resolves at job time, which puts the highest-privilege step in this repository — the one
# holding VERCEL_TOKEN and SENTRY_AUTH_TOKEN — on a version nobody here chose. It is not in `pnpm-lock.yaml`, so nothing
# records it and Dependabot never proposes it, and a green deploy can turn red with no commit behind it: the hardest
# kind of failure to read, because the diff is empty.
#
# **`minimumReleaseAge` in `pnpm-workspace.yaml` does cover `dlx`.** So the unpinned form was never resolving to
# *newest* — it was resolving to newest-at-least-a-day-old, which is the supply-chain half of the problem already
# handled. What the pin adds is the reproducibility half.
#
# That same setting constrains this value: **pin only to a version already past the 24-hour cutoff.** A fresher one is
# refused outright — `ERR_PNPM_NO_MATURE_MATCHING_VERSION`, before a single deploy step runs — which is the guard
# working, not a bug to route around. Bumping is a normal pull request; check the publish date first, and watch for a
# CLI major, which is where `vercel build`'s output layout moves.
env:
  VERCEL_CLI: vercel@58.11.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Skip pull requests from forks, which cannot possibly pass. GitHub withholds secrets from a fork's `pull_request`
    # run by design, so `VERCEL_TOKEN` arrives empty and the first step fails — leaving an outside contributor with a
    # red required-looking check on their first pull request, caused by a permission they cannot be given and pointing
    # at nothing they wrote. CI's own quality, static-export, and browser jobs need no secrets and still run, so the
    # change is still fully checked; what is lost is a preview URL nobody could have generated anyway.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    # The workflow-level `contents: read` above sets every other scope to none, which the final step needs one exception
    # to: posting the preview URL back to the pull request is a write, and without this it fails with a 403 *after* a
    # successful deploy — the most confusing place for a permissions error to surface. Granted per job rather than
    # workflow-wide so the scope covers only the job that actually writes.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Pull Vercel Environment
        run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # All three Sentry values are *build-time* ones, unlike CONGRESS_API_KEY and the DSN: `next.config.ts` reads them
      # while `withSentryConfig` uploads source maps during this step, and nothing reads them at runtime. That is why
      # they sit here rather than in the Vercel project settings — `vercel build` runs the build in this runner, so this
      # step's environment is what the config sees. Their absence is not an error: the build succeeds and the app still
      # reports, it just reports against minified frames. @see "Error Reporting" in docs/deployment.md.
      #
      # Only the token is a `secret`. The org and project slugs are `vars` because they are not credentials — they are
      # already visible in any Sentry URL — and because GitHub masks a secret's value everywhere it appears in a log. A
      # masked org slug turns "uploading to organization ehharding" into "uploading to organization ***" in exactly the
      # failed-upload log someone is reading to find out which organization it tried.
      - name: Build via Vercel
        run: pnpm dlx "$VERCEL_CLI" build ${{ github.event_name != 'pull_request' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(pnpm dlx "$VERCEL_CLI" deploy --prebuilt ${{ github.event_name != 'pull_request' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # One comment per pull request, rewritten in place on each push rather than appended to.
      #
      # `createComment` unconditionally is how a ten-commit pull request ends up with ten "Preview Deployed" comments,
      # nine of them pointing at deployments of code that no longer exists — and the newest at the bottom of a thread
      # that reviewers have to scroll past to reach the review. Editing one comment keeps the URL in a fixed place and
      # keeps it current, which is the only state in which it is useful.
      #
      # The marker is an HTML comment, invisible when rendered, because matching on the body text would also match a
      # human quoting the bot.
      - name: Comment Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- civic-ledger:vercel-preview -->';
            const body = `${marker}\nPreview Deployed: ${process.env.PREVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
