name: Deploy (Vercel)

# The production deployment: the API key stays server-side, and the app needs route handlers and ISR. One-time setup
# (linking the project, repo secrets, the Vercel-side env vars) is in "Primary: Vercel" in docs/deployment.md.

# Documentation-only changes skip this workflow: they would ship an identical bundle whose on-demand pages all start
# uncached. A change mixing docs with code still deploys, since a path filter skips only when *every* file matches.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: deploy-vercel-${{ github.ref }}
  cancel-in-progress: true

# The Vercel CLI, pinned. It runs the step holding VERCEL_TOKEN and SENTRY_AUTH_TOKEN and is not in the lockfile, so
# unpinned it would change under a deploy with no commit behind it.
#
# - `minimumReleaseAge` in pnpm-workspace.yaml covers `dlx` too, so pin only a version already a day old; a fresher one
#   fails with `ERR_PNPM_NO_MATURE_MATCHING_VERSION`. Watch for a CLI major, which is where `vercel build`'s output
#   moves.
# - `--allow-build=esbuild` on each call: a `dlx` install is its own project, so the workspace's `allowBuilds` does not
#   reach it, and pnpm 12 fails on a skipped build script. It names a package that file already trusts.
# - The pin caps the Node major `engines` may name, since `vercel build` checks it against its own table.
env:
  VERCEL_CLI: vercel@65.16.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Skip pull requests from forks: GitHub withholds secrets from them, so the first step could only fail. CI's own
    # jobs need no secrets and still check the change.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    # The Vercel CLI step needs both IDs to find the project, so they are stated once for the job rather than per step.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    # Posting the preview URL back to the pull request is a write; granted to this job alone.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Pull Vercel Environment
        run: pnpm dlx --allow-build=esbuild "$VERCEL_CLI" pull --yes --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} --token=${{ secrets.VERCEL_TOKEN }}

      # The Sentry values are build-time only (source-map upload), and `vercel build` runs in this runner, so they come
      # from GitHub rather than Vercel. All optional. The slugs are `vars`, not secrets, so failed-upload logs are not
      # masked. See "Error Reporting" in docs/deployment.md.
      - name: Build via Vercel
        run: pnpm dlx --allow-build=esbuild "$VERCEL_CLI" build ${{ github.event_name != 'pull_request' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(pnpm dlx --allow-build=esbuild "$VERCEL_CLI" deploy --prebuilt ${{ github.event_name != 'pull_request' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # One comment per pull request, edited in place on each push so the URL stays current and in one place. The marker
      # is an invisible HTML comment, so a human quoting the bot never matches.
      - name: Comment Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- civic-ledger:vercel-preview -->';
            const body = `${marker}\nPreview Deployed: ${process.env.PREVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
