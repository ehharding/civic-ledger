name: Set Up Node and pnpm
description: Installs pnpm, installs the Node version this repository pins, and restores dependencies from the lockfile.

# Every job in every workflow opens with these steps, stated once so they cannot drift between jobs. Checkout stays with
# the caller, whose own first step owns it.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        # The same file a contributor's `nvm use` reads, so local and CI cannot drift apart.
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
