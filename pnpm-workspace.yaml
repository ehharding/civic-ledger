# `@sentry/cli`'s install script downloads the binary the source-map upload shells out to; without it, stack traces name
# minified chunks. The upload only runs when `SENTRY_AUTH_TOKEN` is set.
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  sharp: true

# Refuse to resolve any version published less than a day ago (the unit is minutes).
#
# A compromised publish is usually yanked within hours; a day of distance keeps it out of the lockfile at no cost. CI is
# unaffected, since `--frozen-lockfile` resolves nothing.
minimumReleaseAge: 1440

# Pins one transitive dependency past a published advisory. Kept narrow on purpose: an override is a claim that this
# project knows better than a package's own range, so each one names the single edge it rewrites and says why.
#
# `@esbuild-kit/core-utils` asks for `esbuild@0.18.20`, inside GHSA-67mh-4wv8-2f99 (any website a developer visits can
# query their local esbuild server). It arrives only through `drizzle-kit`'s deprecated `@esbuild-kit/*` dependency.
# Dev-only, and closed anyway so the audit stays empty rather than one line everybody scrolls past. `pnpm db:generate`
# works with this override.
#
# Remove this the day `drizzle-kit` drops `@esbuild-kit/*` — or the day the deferred persistence layer is either built
# or abandoned, since drizzle-kit is a dev tool for a feature that has no code calling it yet. See docs/roadmap.md.
overrides:
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"

# Advisories `pnpm audit` is told to skip, each by its exact GHSA ID. This is the last resort after an override: it is
# for a finding with no fixed version to override *to*, and it silences only that one advisory — any other finding
# against the same package still fails CI.
#
# GHSA-fc5q-39xc-vjpf (picomatch <= 4.0.7, ReDoS via repeated extglobs, high): no patched release exists. Exploiting it
# requires an attacker-supplied glob pattern, and picomatch is reached only through build and test tooling whose
# patterns come from this repository's own config; nothing at runtime matches globs.
#
# Remove this the day picomatch ships a fix: delete the entry, run `pnpm update`, and `pnpm audit --audit-level high`
# should come back clean. If it still reports this advisory after that, the fixed version has not reached the tree yet.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
